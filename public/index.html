<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Wiki · 文档浏览</title>
<meta name="description" content="Easy Wiki — 零构建动态文档浏览器，一个命令即可浏览任意文件夹的 md / txt / html 文档">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <button id="sidebar-toggle" class="icon-btn" title="折叠/展开侧栏">☰</button>
    <span class="brand">📚 <span id="brand-title">Easy Wiki</span></span>
  </div>
  <div class="topbar-center">
    <input id="search" type="search" placeholder="搜索文件名…" autocomplete="off">
  </div>
  <div class="topbar-right">
    <label class="auto" title="定时重新读取文件树"><input id="autorefresh" type="checkbox"> 自动刷新</label>
    <button id="refresh" class="primary" title="重新读取文件树（保留展开状态）">刷新</button>
    <button id="edit-btn" class="edit-btn" title="编辑当前文档（需输入密码）" hidden>编辑</button>
    <button id="theme-toggle" class="icon-btn" title="切换暗色/亮色模式">🌙</button>
    <a id="github-link" class="icon-btn github-icon" href="https://github.com/endcy/easy-wiki" target="_blank" rel="noopener" title="GitHub">
      <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
      </svg>
    </a>
  </div>
</header>

<div class="main">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-tree" id="tree"></div>
    <div class="sidebar-foot" id="foot"></div>
  </aside>
  <div class="divider" id="divider" title="拖拽调整宽度"></div>
  <section class="content">
    <div class="tab-bar" id="tab-bar"></div>
    <div class="tab-content" id="tab-content"></div>
  </section>
</div>

<!-- 密码弹窗 -->
<div class="modal" id="password-modal" hidden>
  <div class="modal-card">
    <h3 id="modal-title">请输入编辑密码</h3>
    <input id="password-input" type="password" placeholder="密码" autocomplete="off">
    <div class="modal-actions">
      <button id="password-cancel">取消</button>
      <button id="password-confirm" class="primary">确认</button>
    </div>
    <div class="modal-error" id="modal-error"></div>
  </div>
</div>

<!-- 右键上下文菜单 -->
<div class="ctx-menu" id="ctx-menu" hidden>
  <div class="ctx-item" data-action="mkdir">📁 新建文件夹</div>
  <div class="ctx-item" data-action="upload">📤 上传文件</div>
</div>
<input type="file" id="upload-input" hidden multiple>

<script src="/app.js"></script>
</body>
</html>
